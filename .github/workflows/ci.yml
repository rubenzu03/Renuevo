name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: renuevo

jobs:
  checks:
    name: Lint, typecheck, test & coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: renuevo
          POSTGRES_PASSWORD: renuevo
          POSTGRES_DB: renuevo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renuevo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: renuevo/pnpm-lock.yaml

      - name: Enable pnpm (packageManager-pinned)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: renuevo/coverage
          if-no-files-found: ignore

  docker-build:
    name: Validate Docker image build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./renuevo
          file: ./renuevo/Dockerfile
          push: false
          tags: renuevo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max