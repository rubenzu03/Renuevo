# Production stack: runs the published image from GHCR against its own
# PostgreSQL. Requires the same env vars as dev (see .env.example); for real
# email set SMTP_HOST/SMTP_PORT/MAIL_FROM to a working SMTP provider instead
# of the dev Mailhog defaults.
#
#   docker compose -f docker-compose.prod.yml up -d --pull always
#
services:
  db:
    image: postgres
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

  app:
    image: ghcr.io/rubenzu03/renuevo:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      APP_PASSWORD: ${APP_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL}
      CRON_SECRET: ${CRON_SECRET}
      CRON_SCHEDULE: ${CRON_SCHEDULE}
      BANK_PROVIDER: ${BANK_PROVIDER:-mock}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_ACCESS_TOKEN: ${PLAID_ACCESS_TOKEN:-}

volumes:
  db-data: